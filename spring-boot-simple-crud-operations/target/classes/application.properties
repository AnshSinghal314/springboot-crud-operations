spring.application.name=spring-boot-simple-crud-operations

server.port=2004

# ==========================================
# MySQL DATABASE CONFIGURATION
# ==========================================

# 1. Database Connection Link
spring.datasource.url=jdbc:mysql://localhost:3306/spring-boot-11pm-advjava-secutiry-usertable

# 2. Database Credentials
spring.datasource.username=root
spring.datasource.password=root

# 3. MySQL Driver Class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

# Automatically update the database schema based on your Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show executed SQL queries in the console log
spring.jpa.show-sql=true

# Optional: Specify the Hibernate Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable JDBC batching
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Order INSERT statements for more efficient batching
spring.jpa.properties.hibernate.order_inserts=true

# Order UPDATE statements for more efficient batching
spring.jpa.properties.hibernate.order_updates=true

# Optional: collect Hibernate statistics for performance analysis
spring.jpa.properties.hibernate.generate_statistics=true
